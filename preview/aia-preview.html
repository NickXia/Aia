<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aia · 交互原型</title>
<style>
  :root{
    --bg:#f8f5ec; --surface:#f6f2e8; --alt:#ece6d6; --alt2:#e2dac5;
    --divider:#ddd4bf; --text:#33302a; --text2:#857d6b; --text3:#b3ab97;
    --accent:#3e5c63; --accent-soft:#e6ecea; --danger:#a83f2e;
    --scrim:rgba(40,36,28,.35); --page:#e9e3d3;
    --seal:#a83f2e; --serif:"Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
  }
  body.dark{
    --bg:#1c1c1a; --surface:#222220; --alt:#2b2b28; --alt2:#343430;
    --divider:#38372f; --text:#e8e4d6; --text2:#a39b87; --text3:#6f6a5b;
    --accent:#93b1a5; --accent-soft:#242c29; --danger:#c05a48;
    --scrim:rgba(0,0,0,.55); --page:#131311;
    --seal:#b0503c; --serif:"Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"HarmonyOS Sans SC","PingFang SC",
      "Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(1200px 700px at 50% -10%,#f2edde 0%,var(--page) 60%);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    gap:64px;padding:40px 24px;transition:background .3s;
  }
  /* ---------------- 左侧说明 ---------------- */
  .intro{max-width:250px;flex:0 0 auto}
  .intro h1{font-family:var(--serif);font-size:34px;letter-spacing:4px;margin:0 0 6px;font-weight:600}
  .intro h1 span{color:var(--seal)}
  .intro p{font-size:13px;line-height:1.75;color:#7b8189;margin:0 0 18px}
  .body.dark .intro p{}
  .hints{display:flex;flex-direction:column;gap:9px}
  .hint{font-size:12px;color:#6f757e;display:flex;gap:8px;align-items:flex-start;line-height:1.5}
  .hint i{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:6px;flex:0 0 auto}
  .toggle-theme{
    margin-top:22px;border:1px solid rgba(120,130,145,.25);background:transparent;
    color:#6f757e;font-size:12px;padding:8px 14px;border-radius:100px;cursor:pointer;
    font-family:inherit;transition:.2s;
  }
  .toggle-theme:hover{border-color:var(--accent);color:var(--accent)}

  /* ---------------- 手机 ---------------- */
  .phone{
    width:390px;height:844px;flex:0 0 auto;position:relative;
    background:var(--bg);border-radius:48px;overflow:hidden;
    box-shadow:0 0 0 10px #14161a,0 0 0 12px #2a2d33,0 40px 80px -20px rgba(20,25,40,.45);
    display:flex;flex-direction:column;transition:background .3s;
  }
  .statusbar{
    height:46px;flex:0 0 46px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 6px;font-size:13px;font-weight:600;color:var(--text);
  }
  .sb-right{display:flex;align-items:center;gap:5px}
  .sb-right svg{display:block}
  .screen{position:relative;flex:1;overflow:hidden}
  .homebar{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);
    width:134px;height:5px;border-radius:3px;background:var(--text);opacity:.24;z-index:60;
    pointer-events:none}

  /* ---------------- 内容区 ---------------- */
  .content{position:absolute;inset:52px 0 0 0;overflow:hidden}
  .scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}

  /* 主页 */
  .home{padding:0 20px 40px}
  .hero{position:relative;text-align:center;padding:46px 0 30px;margin-bottom:6px}
  .hero .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:88px;pointer-events:none}
  .brand{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px}
  .brand svg{display:block}
  .brand b{font-family:var(--serif);font-size:34px;letter-spacing:10px;text-indent:10px;font-weight:600;color:var(--text)}
  .brand .seal{font-family:var(--serif);font-style:normal;width:20px;height:20px;border-radius:3px;
    background:var(--seal);color:#f8f5ec;font-size:11px;line-height:20px;text-align:center;letter-spacing:0;text-indent:0}
  .tagline{position:relative;font-family:var(--serif);font-size:12.5px;color:var(--text2);
    letter-spacing:5px;text-indent:5px;margin:0 0 30px}
  .dials{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 0}
  .dial{padding:8px 0 12px;display:flex;flex-direction:column;align-items:center;gap:8px;
    cursor:pointer;border-radius:14px;transition:background .15s}
  .dial:active{background:var(--alt)}
  .dial .face{
    width:52px;height:52px;border-radius:50%;background:transparent;border:1px solid var(--divider);
    display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:500;
    font-family:var(--serif);transition:border-color .15s;
  }
  .dial:hover .face{border-color:var(--accent)}
  .dial span{font-size:11px;color:var(--text2);letter-spacing:1px}
  .section-label{font-size:11px;color:var(--text3);margin:32px 0 4px;letter-spacing:2px}
  .recent{display:flex;align-items:center;gap:11px;padding:9px 0;cursor:pointer}
  .recent .face{width:28px;height:28px;border-radius:50%;background:var(--alt);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex:0 0 auto}
  .recent .t{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .recent .u{font-size:10px;color:var(--text3);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .recent > div:last-child{min-width:0;flex:1}

  /* 网页 */
  .web{background:var(--bg);min-height:100%}
  .web .sitebar{
    position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--divider);
    padding:12px 20px;font-size:12.5px;color:var(--text2);display:flex;align-items:center;gap:8px;z-index:2;
  }
  .web .sitebar b{color:var(--text);font-size:13px;font-weight:600}
  .web .article{padding:22px 20px 80px}
  .web h1{font-family:var(--serif);font-size:23px;line-height:1.5;margin:0 0 12px;letter-spacing:1px}
  .web .meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text3);margin-bottom:20px}
  .web .meta .av{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#5d7d84,#3e5c63)}
  .web .cover{height:150px;border-radius:14px;margin:0 0 20px;
    background:linear-gradient(160deg,#e7e2d1,#f1eee2);position:relative;overflow:hidden}
  body.dark .web .cover{background:linear-gradient(160deg,#28281f,#30302a)}
  .web .cover:after{content:"山";position:absolute;right:18px;bottom:-20px;font-size:92px;
    font-weight:600;font-family:var(--serif);color:rgba(62,92,99,.18)}
  .web p{font-size:14.5px;line-height:1.85;color:var(--text);margin:0 0 16px;opacity:.92}
  .web h2{font-size:16px;margin:26px 0 10px}
  .web .quote{border-left:3px solid var(--seal);padding:2px 0 2px 14px;color:var(--text2);
    font-size:13.5px;line-height:1.8;margin:18px 0}
  .web .result{padding:14px 0;border-bottom:1px solid var(--divider)}
  .web .result .u{font-size:11px;color:var(--text3)}
  .web .result .t{font-size:15px;color:var(--accent);margin:3px 0 5px;font-weight:500}
  .web .result .d{font-size:12.5px;color:var(--text2);line-height:1.6}

  /* ---------------- 工具栏 ---------------- */
  .toolbar{
    position:absolute;left:0;right:0;top:0;padding-bottom:0;display:block;
    background:var(--surface);border-bottom:.5px solid var(--divider);z-index:20;
    transition:background .3s;
  }
  .tbinner{display:flex;align-items:center;height:52px;padding:0 6px;position:relative}
  .tb-btn{
    width:38px;height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;
    background:none;border:0;padding:0;cursor:pointer;color:var(--text2);position:relative;
  }
  .tb-btn svg{display:block}
  .tb-btn:disabled{opacity:.26;cursor:default}
  .tb-btn:not(:disabled):active{opacity:.5}
  .pill{
    flex:1;height:38px;margin:0 2px;border-radius:100px;background:var(--alt);
    display:flex;align-items:center;gap:7px;padding:0 11px 0 13px;cursor:text;min-width:0;
  }
  .pill .txt{flex:1;font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .pill .txt.ph{color:var(--text3)}
  .pill svg{color:var(--text2);flex:0 0 auto}
  .tabnum{
    min-width:27px;height:27px;padding:0 5px;border:1.5px solid var(--text);border-radius:9px;
    display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;
    font-style:normal;color:var(--text);line-height:1;
  }
  .editor{display:none;flex:1;align-items:center;gap:4px}
  .editor input{
    flex:1;height:38px;border:0;border-radius:100px;background:var(--alt);color:var(--text);
    font-size:15px;padding:0 14px;outline:none;font-family:inherit;min-width:0;
  }
  .editor button{background:none;border:0;color:var(--text2);font-size:14px;padding:8px 10px;
    cursor:pointer;font-family:inherit}
  .toolbar.editing .tb-btn,.toolbar.editing .pill{display:none}
  .toolbar.editing .editor{display:flex}
  .progress{position:absolute;top:0;left:0;height:2px;width:0;background:var(--accent);
    border-radius:0 1px 1px 0;opacity:0;transition:width .2s linear,opacity .3s}

  /* ---------------- 覆盖层 ---------------- */
  .overlay{position:absolute;inset:0;z-index:40;display:none}
  .overlay.on{display:block}
  .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s}
  .overlay.on .scrim{opacity:1}

  .sheet{
    position:absolute;left:0;right:0;bottom:0;background:var(--surface);
    border-radius:24px 24px 0 0;transform:translateY(100%);
    transition:transform .26s cubic-bezier(.22,.7,.3,1);padding-bottom:32px;
  }
  .overlay.on .sheet{transform:translateY(0)}
  .grab{width:34px;height:4px;border-radius:2px;background:var(--alt2);margin:8px auto 14px}

  .menu-grid{display:grid;grid-template-columns:repeat(4,1fr)}
  .menu-item{padding:6px 0 14px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
  .menu-item:active .mi-face{background:var(--alt2)}
  .mi-face{width:46px;height:46px;border-radius:14px;background:var(--alt);
    display:flex;align-items:center;justify-content:center;color:#7c828c;transition:background .12s}
  body.dark .mi-face{color:#9aa0a8}
  .menu-item span{font-size:11px;color:var(--text2)}

  .full{
    position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;
    opacity:0;transform:scale(.96);transition:opacity .18s,transform .2s;
  }
  .overlay.on .full{opacity:1;transform:scale(1)}
  .panel-head{display:flex;align-items:center;padding:14px 18px 8px}
  .panel-head h3{font-size:17px;font-weight:500;margin:0;flex:1}
  .panel-head button{background:none;border:0;color:var(--accent);font-size:14px;
    padding:6px 4px 6px 10px;cursor:pointer;font-family:inherit}
  .panel-head .plain{color:var(--text2)}

  .tabs-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 18px;
    align-content:start;overflow-y:auto;scrollbar-width:none}
  .tabs-grid::-webkit-scrollbar{display:none}
  .tabcard{height:158px;border-radius:16px;background:var(--surface);overflow:hidden;
    display:flex;flex-direction:column;border:.5px solid var(--divider);cursor:pointer;position:relative}
  .tabcard.active{border:1.6px solid var(--accent)}
  .tabhead{display:flex;align-items:center;gap:7px;padding:9px 7px 9px 9px;height:40px}
  .tabhead .face{width:20px;height:20px;border-radius:6px;background:var(--alt);
    display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;flex:0 0 auto}
  .tabhead .t{font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabhead .x{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;color:var(--text3);flex:0 0 auto}
  .tabhead .x:hover{background:var(--alt)}
  .tabbody{flex:1;background:var(--alt);display:flex;align-items:center;justify-content:center;
    font-size:40px;font-weight:700;opacity:.9}
  .tabbody span{opacity:.22}
  .panel-foot{display:flex;gap:10px;padding:14px 18px 34px}
  .ghost-btn{border:0;background:var(--alt);color:var(--text2);font-size:12px;
    padding:11px 16px;border-radius:100px;cursor:pointer;font-family:inherit;
    flex:0 0 auto;white-space:nowrap;
    min-width:88px;text-align:center;justify-content:center;display:inline-flex;align-items:center}
  .solid-btn{flex:1;border:0;background:var(--text);color:var(--surface);font-size:12px;
    height:40px;border-radius:100px;cursor:pointer;font-family:inherit;font-weight:500}

  .rows{flex:1;overflow-y:auto;padding:0 18px;scrollbar-width:none}
  .rows::-webkit-scrollbar{display:none}
  .row{display:flex;align-items:center;gap:11px;padding:9px 0;cursor:pointer}
  .row .face{width:32px;height:32px;border-radius:10px;background:var(--alt);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex:0 0 auto}
  .row .t{font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .u{font-size:10px;color:var(--text3);margin-top:2px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .row .x{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;color:var(--text3);flex:0 0 auto}
  .row .x:hover{background:var(--alt)}
  .row > div:nth-child(2){min-width:0;flex:1}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;color:var(--text3);font-size:12px}

  /* 设置 */
  .set-scroll{flex:1;overflow-y:auto;padding:4px 18px 24px;scrollbar-width:none}
  .set-scroll::-webkit-scrollbar{display:none}
  .set-label{font-size:11px;color:var(--text3);padding:18px 4px 7px}
  .card{background:var(--alt);border-radius:16px;padding:0 14px}
  .set-row{display:flex;align-items:center;gap:12px;min-height:46px;padding:11px 0}
  .set-row + .set-row{border-top:.5px solid var(--divider)}
  .set-row .lbl{flex:1;font-size:14px}
  .set-row .lbl small{display:block;font-size:10px;color:var(--text3);margin-top:2px}
  .set-row .val{font-size:14px;color:var(--text2)}
  .set-row.danger .lbl{color:var(--danger)}
  .switch{width:44px;height:26px;border-radius:100px;background:var(--alt2);position:relative;
    cursor:pointer;transition:background .2s;flex:0 0 auto}
  .switch.on{background:var(--accent)}
  .switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
    background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch.on i{transform:translateX(18px)}
  .engines{display:none;padding-bottom:6px}
  .engines.on{display:block}
  .engine-row{display:flex;align-items:center;height:40px;font-size:14px;color:var(--text2);cursor:pointer}
  .engine-row.on{color:var(--accent)}
  .engine-row .ck{margin-left:auto;color:var(--accent)}
  .chev{transition:transform .2s;color:var(--text3)}
  .chev.on{transform:rotate(90deg)}
  .footnote{text-align:center;font-size:10px;color:var(--text3);padding:18px 0 8px}

  @media (max-width:820px){
    body{flex-direction:column;gap:26px;padding:24px 12px}
    .intro{max-width:390px;order:-1;text-align:center}
    .hints{display:none}
  }
  /* 视口不够高时整体缩小，保证整机完整可见 */
  @media (max-height:980px){ .phone{zoom:.9} }
  @media (max-height:900px){ .phone{zoom:.82} }
  @media (max-height:820px){ .phone{zoom:.72} }
  @media (max-height:740px){ .phone{zoom:.62} }
</style>
</head>
<body>

<div class="intro">
  <h1>Ai<span>a</span></h1>
  <p>鸿蒙极简浏览器 · 交互原型<br/>界面上只留一条地址栏，其余都在拇指够得到的地方。</p>
  <div class="hints">
    <div class="hint"><i></i><span>点顶部地址胶囊，输入网址或搜索词，回车</span></div>
    <div class="hint"><i></i><span>点右侧 ① 图标管理标签，点 ⋯ 打开菜单</span></div>
    <div class="hint"><i></i><span>菜单里可以进书签、历史、设置</span></div>
    <div class="hint"><i></i><span>‹ 返回上一页，返回箭头替代了传统主页按钮</span></div>
  </div>
  <button class="toggle-theme" onclick="document.body.classList.toggle('dark')">切换深色 / 浅色</button>
</div>

<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-right">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1" opacity=".35"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 10.2 5.9 8.1a3 3 0 0 1 4.2 0L8 10.2Zm0-3.6a6 6 0 0 0-4.2 1.7L2.4 6.9a8 8 0 0 1 11.2 0l-1.4 1.4A6 6 0 0 0 8 6.6Zm0-3.6a9.5 9.5 0 0 0-6.6 2.7L0 4.3a11.5 11.5 0 0 1 16 0l-1.4 1.4A9.5 9.5 0 0 0 8 3Z"/></svg>
      <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="3" stroke="currentColor" opacity=".4"/><rect x="2.5" y="2.5" width="14" height="6" rx="1.6" fill="currentColor"/><path d="M22.5 4v3a2 2 0 0 0 0-3Z" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>

  <div class="screen">
    <div class="content">
      <!-- 主页 -->
      <div class="scroll" id="homeView">
        <div class="home">
          <div class="hero">
            <svg class="hills" viewBox="0 0 320 90" preserveAspectRatio="none">
              <path d="M0 66 Q36 30 76 54 T150 48 T228 60 T320 42 V90 H0 Z" fill="#3e5c63" opacity=".09"/>
              <path d="M0 80 Q56 48 116 68 T232 72 T320 60 V90 H0 Z" fill="#33302a" opacity=".07"/>
            </svg>
            <div class="brand">
              <b>Aia</b>
              <i class="seal">雅</i>
            </div>
            <div class="tagline">简单到只剩你需要的</div>
          </div>
          <div class="dials" id="dials"></div>
          <div class="section-label">最近访问</div>
          <div id="recents"></div>
        </div>
      </div>

      <!-- 网页 -->
      <div class="scroll" id="webView" style="display:none">
        <div class="web">
          <div class="sitebar" id="sitebar"></div>
          <div class="article" id="article"></div>
        </div>
      </div>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar" id="toolbar">
      <div class="progress" id="progress"></div>
      <div class="tbinner">
        <button class="tb-btn" id="btnBack" aria-label="后退">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
        </button>
        <button class="tb-btn" id="btnFwd" aria-label="前进">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>

        <div class="pill" id="pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.4" width="14" height="10.2" rx="2.4"/><path d="M8.4 10.4V8a3.6 3.6 0 0 1 7.2 0v2.4"/></svg>
          <span class="txt ph" id="pillText">搜索或输入网址</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 12a8.4 8.4 0 1 1-2.5-6"/><path d="M20.6 4.2v4.5h-4.5"/></svg>
        </div>

        <div class="editor">
          <input id="addrInput" placeholder="搜索或输入网址" />
          <button id="btnCancel">取消</button>
        </div>

        <button class="tb-btn" id="btnTabs" aria-label="标签页">
          <span class="tabnum" id="tabCount">1</span>
        </button>
        <button class="tb-btn" id="btnMenu" aria-label="菜单">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
        </button>
      </div>
    </div>
    <div class="homebar"></div>

    <!-- 菜单 -->
    <div class="overlay" id="ovMenu">
      <div class="scrim" onclick="closeAll()"></div>
      <div class="sheet">
        <div class="grab"></div>
        <div class="menu-grid" id="menuGrid"></div>
      </div>
    </div>

    <!-- 标签 -->
    <div class="overlay" id="ovTabs">
      <div class="full">
        <div class="panel-head">
          <h3>标签页</h3>
          <button onclick="closeAll()">完成</button>
        </div>
        <div class="tabs-grid" id="tabsGrid"></div>
        <div class="panel-foot">
          <button class="ghost-btn" onclick="closeAllTabs()">关闭全部</button>
          <button class="solid-btn" onclick="newTab()">新建标签页</button>
        </div>
      </div>
    </div>

    <!-- 书签 / 历史 -->
    <div class="overlay" id="ovRecords">
      <div class="scrim" onclick="closeAll()"></div>
      <div class="sheet" style="height:74%;display:flex;flex-direction:column">
        <div class="grab"></div>
        <div class="panel-head">
          <h3 id="recTitle">书签</h3>
          <button class="plain" id="recClear" onclick="clearRecords()">清空</button>
          <button onclick="closeAll()">完成</button>
        </div>
        <div class="rows" id="recRows"></div>
      </div>
    </div>

    <!-- 设置 -->
    <div class="overlay" id="ovSettings">
      <div class="full">
        <div class="panel-head">
          <h3>设置</h3>
          <button onclick="closeAll()">完成</button>
        </div>
        <div class="set-scroll" id="setBody"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------------- 数据 ---------------- */
const DIALS = [
  {n:'百度', u:'baidu.com', c:'#3f7bff'},
  {n:'知乎', u:'zhihu.com', c:'#1b7cf2'},
  {n:'B站', u:'bilibili.com', c:'#fb7299'},
  {n:'微博', u:'weibo.cn', c:'#e6412e'},
  {n:'淘宝', u:'taobao.com', c:'#ff6a00'},
  {n:'豆瓣', u:'douban.com', c:'#2fa84f'},
  {n:'Google', u:'google.com', c:'#4285f4'},
  {n:'GitHub', u:'github.com', c:'#24292f'}
];
const PALETTE = ['#3f7bff','#7c5cff','#e0574b','#22a06b','#f2994a','#0f9bd7','#c4559b','#5b6b7f'];
const ENGINES = ['百度','必应','Google','搜狗','DuckDuckGo'];
const TITLES = {
  'sspai.com':'少数派 · 高效工作，品质生活',
  'zhihu.com':'知乎 · 有问题，就会有答案',
  'bilibili.com':'哔哩哔哩 (゜-゜)つロ 干杯~',
  'baidu.com':'百度一下，你就知道',
  'weibo.cn':'微博',
  'taobao.com':'淘宝网',
  'douban.com':'豆瓣',
  'google.com':'Google',
  'github.com':'GitHub',
  'developer.mozilla.org':'MDN Web Docs'
};

let state = {
  tabs: [{id:1, title:'新标签页', url:'', hist:[], hi:0}],
  active:1,
  seq:1,
  recordsMode:'bookmark',
  bookmarks:[
    {t:'少数派 · 高效工作，品质生活', u:'sspai.com'},
    {t:'知乎 · 有问题，就会有答案', u:'zhihu.com'},
    {t:'MDN Web Docs', u:'developer.mozilla.org'}
  ],
  history:[
    {t:'为什么极简浏览器更好用', u:'sspai.com/post/74321'},
    {t:'ArkWeb 内核能力概览', u:'developer.huawei.com/arkweb'},
    {t:'哔哩哔哩 (゜-゜)つロ 干杯~', u:'bilibili.com'},
    {t:'知乎热榜', u:'zhihu.com/hot'}
  ],
  engines:'百度'
};

function tab(){ return state.tabs.find(t=>t.id===state.active) || state.tabs[0]; }
function hostOf(u){ return (u||'').replace(/^https?:\/\//,'').split('/')[0]; }
function colorFor(h){ let s=0; for(const c of h) s=(s*31+c.charCodeAt(0))%99991; return PALETTE[s%PALETTE.length]; }
function initial(u){ const h=hostOf(u).replace(/^www\./,''); return h?h[0].toUpperCase():'Z'; }

/* ---------------- 主页 ---------------- */
document.getElementById('dials').innerHTML = DIALS.map(d=>`
  <div class="dial" onclick="go('${d.u}')">
    <div class="face" style="color:${d.c}">${d.n[0]}</div>
    <span>${d.n}</span>
  </div>`).join('');

document.getElementById('recents').innerHTML = state.history.slice(0,4).map(h=>`
  <div class="recent" onclick="go('${h.u}')">
    <div class="face" style="color:${colorFor(hostOf(h.u))}">${initial(h.u)}</div>
    <div><div class="t">${h.t}</div><div class="u">${hostOf(h.u)}</div></div>
  </div>`).join('');

/* ---------------- 网页假页面 ---------------- */
function articleFor(url){
  const host = hostOf(url);
  const isSearch = /baidu|bing|google|sogou|duckduckgo/.test(host);
  if(isSearch){
    const q = decodeURIComponent((url.split('=')[1]||'极简浏览器')).replace(/\+/g,' ');
    const items = [
      ['极简浏览器的设计哲学 - 少数派','sspai.com','当浏览器不再试图成为操作系统，它才重新变回一扇窗。'],
      ['Via 浏览器为什么让人上瘾','zhihu.com','一个地址栏 + 一个菜单，剩下的全部让给网页。'],
      ['移动端浏览器 UI 的减法','juejin.cn','拇指热区、单行工具栏与信息密度之间的取舍。']
    ];
    return {
      bar:`<b>${host}</b><span>·</span><span>${q}</span>`,
      body:`<h1 style="font-size:18px;margin-bottom:16px">“${q}” 的搜索结果</h1>` +
        items.map(i=>`<div class="result"><div class="u">${i[1]}</div>
          <div class="t">${i[0]}</div><div class="d">${i[2]}</div></div>`).join('') +
        `<p style="margin-top:22px;font-size:11.5px;color:var(--text3)">以上为原型内的示意内容</p>`
    };
  }
  return {
    bar:`<b>${host}</b><span>·</span><span>${new Date().toLocaleDateString('zh-CN')}</span>`,
    body:`
      <h1>为什么极简浏览器更好用</h1>
      <div class="meta"><span class="av"></span><span>少数派</span><span>·</span><span>8 分钟阅读</span></div>
      <div class="cover"></div>
      <p>浏览器大概是手机里最容易变臃肿的应用。新闻推送、天气、小说、购物入口、信息流——它们都被塞进首屏，仿佛打开浏览器的目的不是看网页，而是看这些入口。</p>
      <p>于是有人开始反向做减法：把界面压到一条地址栏，把功能藏进一个菜单。屏幕上只剩网页，其余在你需要的时候才出现。</p>
      <div class="quote">好的工具应该在你使用它的时候消失，而不是不断提醒你它的存在。</div>
      <h2>一、单行工具栏</h2>
      <p>手机屏幕的纵向空间极其昂贵。顶部标题栏 + 地址栏 + 底部工具栏的组合，通常要吃掉 140vp。合并成一条 52vp 的操作行，等于每屏多出三行正文。</p>
      <p>代价是：标签数、菜单、前进后退必须挤在同一行。所以按钮宽度要收紧到 38vp，地址胶囊承担剩下的所有空间——它同时也是输入框、进度指示器和安全状态提示。</p>
      <h2>二、把"新标签页"当空白纸</h2>
      <p>很多浏览器的新标签页信息过载。极简的做法是：只放几个你自己添加的快捷方式，以及最近访问。不做推荐，不做信息流，不假设你想看什么。</p>
      <p>搜索框也不必重复出现——地址栏就在拇指边上，再放一个搜索框只是增加选择成本。</p>
      <h2>三、动效要短</h2>
      <p>底部弹层 240 毫秒，标签面板 200 毫秒。超过 300 毫秒的动画在每天上百次的重复操作里会变成负担。</p>
      <p style="color:var(--text3);font-size:11.5px;margin-top:26px">（原型示意内容，用于预览排版与滚动手感）</p>
    `
  };
}

/* ---------------- 渲染 ---------------- */
function render(){
  const t = tab();
  const home = !t.url;
  document.getElementById('homeView').style.display = home ? 'block' : 'none';
  document.getElementById('webView').style.display = home ? 'none' : 'block';

  const pillText = document.getElementById('pillText');
  if(home){ pillText.textContent='搜索或输入网址'; pillText.classList.add('ph'); }
  else { pillText.textContent = t.url.replace(/^https?:\/\//,'').replace(/\/$/,''); pillText.classList.remove('ph'); }

  document.getElementById('btnBack').disabled = t.hi<=0;
  document.getElementById('btnFwd').disabled = t.hi>=t.hist.length-1;
  document.getElementById('tabCount').textContent = state.tabs.length;

  if(!home){
    const data = articleFor(t.url);
    document.getElementById('sitebar').innerHTML = data.bar;
    document.getElementById('article').innerHTML = data.body;
    document.getElementById('webView').scrollTop = 0;
  }
  renderTabs();
}
function renderTabs(){
  document.getElementById('tabsGrid').innerHTML = state.tabs.map(t=>{
    const home = !t.url;
    const h = hostOf(t.url);
    return `<div class="tabcard ${t.id===state.active?'active':''}" onclick="pick(${t.id})">
      <div class="tabhead">
        <div class="face" style="color:${home?'var(--text2)':colorFor(h)}">${home?'Z':initial(t.url)}</div>
        <div class="t">${home?'新标签页':(t.title||h)}</div>
        <div class="x" onclick="event.stopPropagation();closeTab(${t.id})">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M17.5 6.5 6.5 17.5M6.5 6.5l11 11"/></svg>
        </div>
      </div>
      <div class="tabbody"><span style="color:${home?'var(--text3)':colorFor(h)}">${home?'Aia':initial(t.url)}</span></div>
    </div>`;
  }).join('');
}

/* ---------------- 导航 ---------------- */
function go(input){
  if(!input) return;
  let url = input.trim();
  if(!/^https?:\/\//.test(url)){
    if(/^[\w-]+(\.[\w-]+)+/.test(url) || url.indexOf('localhost')===0) url='https://'+url;
    else {
      const q = encodeURIComponent(url);
      const map = {'百度':'https://www.baidu.com/s?wd=','必应':'https://www.bing.com/search?q=',
        'Google':'https://www.google.com/search?q=','搜狗':'https://www.sogou.com/web?query=',
        'DuckDuckGo':'https://duckduckgo.com/?q='};
      url = (map[state.engines]||map['百度']) + q;
      state.history.unshift({t:'搜索：'+input, u:url});
    }
  }
  const t = tab();
  t.hist = t.hist.slice(0, t.hi+1);
  t.hist.push(url);
  t.hi = t.hist.length-1;
  t.url = url;
  t.title = TITLES[hostOf(url).replace(/^www\./,'')] || hostOf(url);
  closeAll();
  runProgress();
  render();
}
function back(){ const t=tab(); if(t.hi>0){ t.hi--; t.url=t.hist[t.hi]||''; render(); runProgress(); } }
function fwd(){ const t=tab(); if(t.hi<t.hist.length-1){ t.hi++; t.url=t.hist[t.hi]; render(); runProgress(); } }

function runProgress(){
  const p = document.getElementById('progress');
  p.style.transition='none'; p.style.width='0'; p.style.opacity='1';
  requestAnimationFrame(()=>{
    p.style.transition='width .55s cubic-bezier(.2,.8,.3,1),opacity .3s .5s';
    p.style.width='100%';
    p.style.opacity='0';
  });
}

/* ---------------- 标签操作 ---------------- */
function newTab(){ state.seq++; const t={id:state.seq,title:'新标签页',url:'',hist:[],hi:0};
  state.tabs.push(t); state.active=t.id; closeAll(); render(); }
function pick(id){ state.active=id; closeAll(); render(); }
function closeTab(id){
  if(state.tabs.length===1){ const t=state.tabs[0]; t.url=''; t.title='新标签页'; t.hist=[]; t.hi=0; render(); return; }
  state.tabs = state.tabs.filter(t=>t.id!==id);
  if(!state.tabs.find(t=>t.id===state.active)) state.active = state.tabs[state.tabs.length-1].id;
  render();
}
function closeAllTabs(){ state.seq++; state.tabs=[{id:state.seq,title:'新标签页',url:'',hist:[],hi:0}];
  state.active=state.seq; closeAll(); render(); }

/* ---------------- 覆盖层 ---------------- */
const MENU = [
  ['书签','bookmark','records:bookmark'],
  ['历史','history','records:history'],
  ['加书签','star','bookmark'],
  ['复制链接','copy','copy'],
  ['刷新','refresh','reload'],
  ['主页','home','home'],
  ['设置','settings','settings'],
  ['关闭标签','close','close']
];
const ICONS = {
  bookmark:'<path d="M6.6 3.6h10.8a1 1 0 0 1 1 1V21L12 16.4 5.6 21V4.6a1 1 0 0 1 1-1z"/>',
  history:'<circle cx="12" cy="12" r="8.4"/><path d="M12 7.4V12l3.2 2"/>',
  star:'<path d="M12 3.6l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9-5.3-2.9-5.3 2.9 1.1-5.9L3.5 9.8l5.9-.8z"/>',
  copy:'<rect x="8.6" y="8.6" width="11.2" height="11.2" rx="2.4"/><path d="M15.4 5.6H7.2a2.4 2.4 0 0 0-2.4 2.4v8.2"/>',
  refresh:'<path d="M20.4 12a8.4 8.4 0 1 1-2.5-6"/><path d="M20.6 4.2v4.5h-4.5"/>',
  home:'<path d="M3.5 10.4 12 3.4l8.5 7"/><path d="M6 9.4V20.4h12V9.4"/>',
  settings:'<path d="M4 7.2h3.4M11.6 7.2H20M4 12h8.4M16.6 12H20M4 16.8h5.4M13.6 16.8H20"/><circle cx="9.5" cy="7.2" r="2.1"/><circle cx="14.5" cy="12" r="2.1"/><circle cx="11.5" cy="16.8" r="2.1"/>',
  close:'<path d="M17.5 6.5 6.5 17.5M6.5 6.5l11 11"/>'
};
document.getElementById('menuGrid').innerHTML = MENU.map(m=>`
  <div class="menu-item" onclick="menuPick('${m[2]}')">
    <div class="mi-face">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[m[1]]}</svg>
    </div>
    <span>${m[0]}</span>
  </div>`).join('');

function openOv(id){ document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('on'));
  document.getElementById(id).classList.add('on'); }
function closeAll(){ document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('on')); }

function menuPick(k){
  if(k.startsWith('records:')){ openRecords(k.split(':')[1]); return; }
  if(k==='bookmark'){ toggleBookmark(); return; }
  if(k==='copy'){ try{ navigator.clipboard.writeText(tab().url||'https://aia.browser'); }catch(e){} closeAll(); return; }
  if(k==='reload'){ closeAll(); runProgress(); return; }
  if(k==='home'){ const t=tab(); t.url=''; t.hist=[]; t.hi=0; closeAll(); render(); return; }
  if(k==='settings'){ openSettings(); return; }
  if(k==='close'){ closeTab(state.active); closeAll(); return; }
}
function toggleBookmark(){
  const t = tab(); if(!t.url) return;
  const i = state.bookmarks.findIndex(b=>b.u===hostOf(t.url));
  if(i>=0) state.bookmarks.splice(i,1);
  else state.bookmarks.unshift({t:t.title||hostOf(t.url), u:hostOf(t.url)});
  closeAll();
}

/* ---------------- 书签 / 历史 ---------------- */
function openRecords(mode){
  state.recordsMode = mode;
  document.getElementById('recTitle').textContent = mode==='history'?'浏览记录':'书签';
  document.getElementById('recClear').textContent = mode==='history'?'清空':'删全部';
  const list = mode==='history'?state.history:state.bookmarks;
  const box = document.getElementById('recRows');
  if(!list.length){
    box.innerHTML = `<div class="empty">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".4">
        ${mode==='history'?ICONS.history:ICONS.bookmark}</svg>
      <span>${mode==='history'?'还没有浏览记录':'还没有书签'}</span></div>`;
  } else {
    box.innerHTML = list.map((r,i)=>`
      <div class="row" onclick="go('${r.u}')">
        <div class="face" style="color:${colorFor(hostOf(r.u))}">${initial(r.u)}</div>
        <div><div class="t">${r.t}</div><div class="u">${hostOf(r.u)}</div></div>
        <div class="x" onclick="event.stopPropagation();delRecord(${i})">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M17.5 6.5 6.5 17.5M6.5 6.5l11 11"/></svg>
        </div>
      </div>`).join('');
  }
  openOv('ovRecords');
}
function delRecord(i){
  if(state.recordsMode==='history') state.history.splice(i,1); else state.bookmarks.splice(i,1);
  openRecords(state.recordsMode);
}
function clearRecords(){
  if(state.recordsMode==='history') state.history=[]; else state.bookmarks=[];
  openRecords(state.recordsMode);
}

/* ---------------- 设置 ---------------- */
function openSettings(){
  const rows = [
    ['set-label','搜索'],
    ['engine'],
    ['row','主页','sspai.com','','home-row'],
    ['set-label','隐私与显示'],
    ['switch','阻止图片加载','省流量，弱网下更快','blockImages',false],
    ['switch','保存浏览记录','','saveHistory',true],
    ['switch','允许 JavaScript','关闭后部分网页无法正常显示','js',true],
    ['switch','发送「不追踪」请求','','dnt',true],
    ['set-label','数据'],
    ['row','清除浏览记录','','danger','clear-history'],
    ['set-label','关于'],
    ['row','Aia 浏览器','1.0.0','','about']
  ];
  let html='';
  let cardOpen=false;
  const closeCard=()=>{ if(cardOpen){ html+='</div>'; cardOpen=false; } };
  const openCard=()=>{ if(!cardOpen){ html+='<div class="card">'; cardOpen=true; } };

  for(const r of rows){
    if(r[0]==='set-label'){ closeCard(); html+=`<div class="set-label">${r[1]}</div>`; continue; }
    if(r[0]==='engine'){
      openCard();
      html+=`<div class="set-row"><div class="lbl">搜索引擎</div>
        <div class="val">${state.engines}</div>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" onclick="toggleEngines(this)">
          <path d="M9.5 5.5 16 12l-6.5 6.5"/></svg></div>
        <div class="engines" id="engBox">${ENGINES.map(e=>`
          <div class="engine-row ${e===state.engines?'on':''}" onclick="pickEngine('${e}')">
            ${e}${e===state.engines?'<svg class="ck" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 12.4 9.6 17.2 19.2 6.6"/></svg>':''}
          </div>`).join('')}</div>`;
      continue;
    }
    if(r[0]==='switch'){
      openCard();
      html+=`<div class="set-row"><div class="lbl">${r[1]}${r[2]?`<small>${r[2]}</small>`:''}</div>
        <div class="switch ${r[4]?'on':''}" onclick="this.classList.toggle('on')"><i></i></div></div>`;
      continue;
    }
    if(r[0]==='row'){
      closeCard(); openCard();
      const danger = r[3]==='danger';
      html+=`<div class="set-row ${danger?'danger':''}"><div class="lbl">${r[1]}</div>
        <div class="val">${r[2]||''}</div></div>`;
      continue;
    }
  }
  closeCard();
  html+=`<div class="footnote">基于 HarmonyOS ArkWeb 内核 · 1.0.0</div>`;
  document.getElementById('setBody').innerHTML = html;
  openOv('ovSettings');
}
function toggleEngines(el){
  const box=document.getElementById('engBox');
  box.classList.toggle('on'); el.classList.toggle('on');
}
function pickEngine(name){
  state.engines=name;
  openSettings();
  document.getElementById('engBox').classList.add('on');
}

/* ---------------- 事件 ---------------- */
document.getElementById('pill').onclick = ()=>{
  const t=tab();
  document.getElementById('toolbar').classList.add('editing');
  const input=document.getElementById('addrInput');
  input.value = t.url||'';
  setTimeout(()=>{ input.focus(); input.select(); },30);
};
document.getElementById('btnCancel').onclick = ()=>{
  document.getElementById('toolbar').classList.remove('editing');
};
document.getElementById('addrInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const v=e.target.value;
    document.getElementById('toolbar').classList.remove('editing');
    go(v);
  }
});
document.getElementById('btnBack').onclick = back;
document.getElementById('btnFwd').onclick = fwd;
document.getElementById('btnTabs').onclick = ()=>openOv('ovTabs');
document.getElementById('btnMenu').onclick = ()=>openOv('ovMenu');

render();

/* 支持通过 ?view=web|tabs|menu|settings|bookmarks 直接进入某个状态（方便演示与截图） */
(function(){
  const q = new URLSearchParams(location.search).get('view');
  if(!q) return;
  if(q==='dark'){ document.body.classList.add('dark'); }
  if(q==='web'){ go('sspai.com/post/74321'); }
  if(q==='search'){ go('极简浏览器'); }
  if(q==='tabs'){ go('sspai.com/post/74321'); newTab(); go('zhihu.com/hot'); newTab(); go('bilibili.com'); openOv('ovTabs'); }
  if(q==='menu'){ go('sspai.com/post/74321'); openOv('ovMenu'); }
  if(q==='bookmarks'){ openRecords('bookmark'); }
  if(q==='settings'){ openSettings(); }
})();
</script>
</body>
